name: Stage Helm CI/CD

on:
  push:
    branches: ['stage']
  pull_request:
    branches: ['stage']
  workflow_dispatch:

env:
  CI: false
  HELM_VALUES_FILE: 'K8s-Manifest/Giga/Helm/values.yaml'

jobs:
  deploy:
    name: build && push image to Docker hub
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
      run_id_short: ${{ steps.vars.outputs.run_id_short }}
    steps:
      - uses: actions/checkout@v3

      - name: Get short SHA and short Run ID
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "run_id_short=${GITHUB_RUN_ID:0:5}" >> $GITHUB_OUTPUT

      - name: Import Secrets
        uses: hashicorp/vault-action@v2.4.0
        with:
          url: ${{ secrets.VAULT_URL }}
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            github/data/general/docker/rumsan username | DOCKERHUB_USERNAME ;
            github/data/general/docker/rumsan password | DOCKERHUB_TOKEN ;
            github/data/giga/stage-helm env | ENV ;

      - name: create environment file
        run: |
          tee ./.env <<<"$ENV"

      - uses: actions/setup-node@v3
        with:
          node-version: 20.13.1

      - name: install dependencies and build apps
        run: |
          npm install -g pnpm@8.14.1
          pnpm install
          pnpm run api:app:generate
          pnpm run api:news:generate
          pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: docker login
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: build && push api
        uses: docker/build-push-action@v3
        with:
          context: .
          file: Dockerfile.api
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            rumsan/giga-helm-api:stage
            rumsan/giga-helm-api:stage-${{ steps.vars.outputs.sha_short }}-${{ steps.vars.outputs.run_id_short }}

      - name: build && push admin
        uses: docker/build-push-action@v3
        with:
          context: .
          file: Dockerfile.admin
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            rumsan/giga-helm-admin:stage
            rumsan/giga-helm-admin:stage-${{ steps.vars.outputs.sha_short }}-${{ steps.vars.outputs.run_id_short }}

      - name: build && push web
        uses: docker/build-push-action@v3
        with:
          context: .
          file: Dockerfile.giga
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            rumsan/giga-helm-web:stage
            rumsan/giga-helm-web:stage-${{ steps.vars.outputs.sha_short }}-${{ steps.vars.outputs.run_id_short }}

      - name: build && push webhook
        uses: docker/build-push-action@v3
        with:
          context: .
          file: Dockerfile.webhook
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            rumsan/giga-helm-webhook:stage
            rumsan/giga-helm-webhook:stage-${{ steps.vars.outputs.sha_short }}-${{ steps.vars.outputs.run_id_short }}

  update-manifest:
    name: Update Kubernetes Manifest
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      IMAGE_TAG: stage-${{ needs.deploy.outputs.sha_short }}-${{ needs.deploy.outputs.run_id_short }}
    steps:
      - name: Import Secrets
        uses: hashicorp/vault-action@v2.4.0
        with:
          url: ${{ secrets.VAULT_URL }}
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            github/data/general/Stage-Manifest repo | MANIFEST_REPO ;
            github/data/general/Stage-Manifest ssh-key | SSH_KEY ;

      - name: Checkout Stage Manifest Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFEST_REPO }}
          ssh-key: ${{ env.SSH_KEY }}

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Update specific image.tag values in Helm values.yaml
        run: |
          echo "Updating admin, api, web, webhook image tags to ${IMAGE_TAG}"
          yq eval '.admin.image.tag = strenv(IMAGE_TAG) |
                   .api.image.tag = strenv(IMAGE_TAG) |
                   .web.image.tag = strenv(IMAGE_TAG) |
                   .webhook.image.tag = strenv(IMAGE_TAG)' -i "${{ env.HELM_VALUES_FILE }}"
        

      - name: Commit and Push Changes
        run: |
          git config user.name "sandab-rumsan"
          git config user.email "sandab@rumsan.net"
          git add "${{ env.HELM_VALUES_FILE }}"
          git commit -m "runner: Update all image tags to $IMAGE_TAG" || echo "No changes to commit"
          git push origin main
