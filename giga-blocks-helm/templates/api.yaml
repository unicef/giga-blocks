apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api.fullname" . }}
  namespace: {{ default .Values.namespace .Release.Namespace }}
  labels:
    {{- toYaml .Values.api.labels | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- toYaml .Values.api.labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- toYaml .Values.api.labels | nindent 8 }}
    spec:
      containers:
        - name: giga-chart-api
          command:
            - /bin/sh
            - -c
          args:
            {{- toYaml .Values.api.args | nindent 12 }}
          image: {{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 3333
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /usr/src/vault
              name: giga-chart-api-secret-volume
              readOnly: true
      {{- if .Values.api.image.secrets }}
      imagePullSecrets:
        {{- toYaml .Values.api.image.secrets | nindent 8 }}
      {{- end }}
      volumes:
        - name: giga-chart-api-secret-volume
          secret:
            secretName:  {{ .Values.api.secretName }}
            items:
              - key: api
                path: env
