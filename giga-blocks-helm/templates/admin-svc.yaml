apiVersion: v1
kind: Service
metadata:
  name: {{ include "admin.fullname" . }}-svc
  namespace: {{ default .Values.namespace .Release.Namespace }}
  labels:
    {{- toYaml .Values.admin.labels | nindent 4 }}
spec:
  type: {{ .Values.admin.service.type }}
  ports:
    - port: {{ .Values.admin.service.port }}
      targetPort: {{ .Values.admin.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- toYaml .Values.admin.labels | nindent 4 }}
