trigger:
  branches:
    include:
    - dev
  paths:
    exclude:
    - apps/**

pool:
  vmImage: ubuntu-latest

variables:
  containerRegistryServiceConnection: $(ACR_SERVICE_CONNECTION)
  imageTag: '$(Build.BuildId)'
  system.debug: true
  kubernetesServiceConnection: $(K8S_SERVICE_CONNECTION)
  kubernetesNamespace: $(KUBERNETES_NAMESPACE)
  CI: false
  acrName: $(ACR_NAME)
  acrUser: $(ACR_USER)
  acrPassword: $(ACR_PASSWORD)

stages:
- stage: Build
  displayName: 'GIGA Blocks root build'
  jobs:
  - job: Build
    displayName: 'GIGA Blocks root build job'

    steps:
    - checkout: self
      fetchTags: true

    - task: DownloadSecureFile@1
      inputs:
        secureFile: '.env.dev.giga-blocks'

    - task: CopyFiles@2
      inputs:
        SourceFolder: '$(Agent.TempDirectory)'
        Contents: '.env.dev.giga-blocks'
        TargetFolder: '$(Build.SourcesDirectory)'

    - script: |
        mv .env.dev.giga-blocks .env
      displayName: 'create .env file'

    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Use Node.js'

    - script: |
        npm install -g pnpm@8.14.1
        pnpm install
        pnpm run api:app:generate
        pnpm run api:news:generate
        pnpm build
      displayName: 'install dependencies and build apps'

    #- task: Docker@2
    #  displayName: Login to container Registry
    #  inputs:
    #    command: login
    #    containerRegistry: $(containerRegistryServiceConnection)
    - script: |
        echo "$(acrPassword)" | docker login $(acrName) -u $(acrUser) --password-stdin
      displayName: Docker login to ACR

    #- task: Docker@2
    #  displayName: Build and push API image to container registry
    #  inputs:
    #    command: buildAndPush
    #    repository: 'giga-blocks-root-api'
    #    dockerfile: './Dockerfile.api'
    #    containerRegistry: $(containerRegistryServiceConnection)
    #    tags: |
    #      $(imageTag)
    - script: |
        docker build -f ./Dockerfile.api -t $(acrName)/giga-blocks-root-api:$(imageTag) .
        docker push $(acrName)/giga-blocks-root-api:$(imageTag)
      displayName: Build and Push API Image to ACR

    #- task: Docker@2
    #  displayName: Build and push admin image to container registry
    #  inputs:
    #    command: buildAndPush
    #    repository: 'giga-blocks-root-admin'
    #    dockerfile: './Dockerfile.admin'
    #    containerRegistry: $(containerRegistryServiceConnection)
    #    tags: |
    #      $(imageTag)

    - script: |
        docker build -f ./Dockerfile.admin -t $(acrName)/giga-blocks-root-admin:$(imageTag) .
        docker push $(acrName)/giga-blocks-root-admin:$(imageTag)
      displayName: Build and Push admin Image to ACR

    #- task: Docker@2
    #  displayName: Build and push web image to container registry
    #  inputs:
    #    command: buildAndPush
    #    repository: 'giga-blocks-root-web'
    #    dockerfile: './Dockerfile.web'
    #    containerRegistry: $(containerRegistryServiceConnection)
    #    tags: |
    #      $(imageTag)
    - script: |
        docker build -f ./Dockerfile.web -t $(acrName)/giga-blocks-root-web:$(imageTag) .
        docker push $(acrName)/giga-blocks-root-web:$(imageTag)
      displayName: Build and Push web Image to ACR


    #- task: Docker@2
    #  displayName: Build and push giga image to container registry
    #  inputs:
    #    command: buildAndPush
    #    repository: 'giga-blocks-root-giga'
    #    dockerfile: './Dockerfile.giga'
    #    containerRegistry: $(containerRegistryServiceConnection)
    #    tags: |
    #      $(imageTag)
    - script: |
        docker build -f ./Dockerfile.giga -t $(acrName)/giga-blocks-root-giga:$(imageTag) .
        docker push $(acrName)/giga-blocks-root-giga:$(imageTag)
      displayName: Build and Push giga Image to ACR
